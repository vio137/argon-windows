name: package-release

# Packaging-only path: takes the compiled argon-windows-x64 artifact from a
# finished windows-build run, adds Servo's engine resources, verifies the
# result by launching it headless from a clean directory, then preserves
# immutable candidate assets. Publication requires a separate explicit action.
# No recompilation - the exact CI-built binary is reused.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'windows-build run ID to package (its argon-windows-x64 artifact)'
        required: true
      raw_run_id:
        description: 'Optional preserved native output to overlay on compatible base distribution'
        required: false
        default: ''
      release_tag:
        description: 'Candidate only. Nightly promotion is a separate verified-artifact workflow.'
        type: choice
        options: [nightly-candidate]
        required: true
        default: 'nightly-candidate'

jobs:
  package:
    name: Package and verify distribution
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - name: Reject non-candidate destinations
        shell: pwsh
        run: |
          if ('${{ inputs.release_tag }}' -ne 'nightly-candidate') { throw 'Only candidate publication is permitted' }
      - name: Download compiled artifact
        uses: actions/download-artifact@v4
        with:
          name: argon-windows-x64
          path: artifact-in
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The artifact wraps the distribution zip itself - expand it so dist/
      # holds argon.exe at its root (this was the layout bug behind the
      # "argon.exe not recognized" smoke failure).
      - name: Expand distribution zip from artifact
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifact-in -Filter *.zip | Select-Object -First 1
          if (-not $zip) { Write-Error "no zip inside downloaded artifact"; exit 1 }
          Expand-Archive -Path $zip.FullName -DestinationPath dist
          if (-not (Test-Path dist/argon.exe)) {
            Get-ChildItem -Recurse dist | Select-Object -First 30 FullName
            Write-Error "argon.exe not at zip root - unexpected layout"
            exit 1
          }

      # The build workflow already packages the Servo resources into the zip;
      # only fetch them (slow codeload) if they are genuinely missing.
      - name: Fetch Servo v0.7.0 engine resources (if missing)
        shell: pwsh
        run: |
          if (Test-Path dist/resources) { Write-Host "resources already in package - skipping fetch"; exit 0 }
          Invoke-WebRequest -Uri 'https://codeload.github.com/servo/servo/zip/refs/tags/v0.7.0' -OutFile servo-src.zip
          Expand-Archive servo-src.zip -DestinationPath servo-src
          Copy-Item -Recurse servo-src/servo-0.7.0/resources dist/resources

      # argon.exe was built by plain `cargo build`, which leaves the ANGLE
      # DLLs (libEGL/libGLESv2, built by the mozangle crate) inside the cargo
      # build tree instead of next to the exe; without them the exe panics
      # with "egl function was not loaded" even for software rendering.
      # Take the exact-version-matched DLLs from Servo's official v0.7.0
      # Windows zip (same mozangle source), pinned by its published sha256.
      - name: Add matching ANGLE DLLs from Servo v0.7.0 official build
        shell: pwsh
        run: |
          if ((Test-Path dist/libEGL.dll) -and (Test-Path dist/libGLESv2.dll)) { Write-Host 'Using build-produced ANGLE DLLs'; exit 0 }
          Invoke-WebRequest -Uri 'https://github.com/servo/servo/releases/download/v0.7.0/servo-x86_64-windows-msvc.zip' -OutFile servo-win.zip
          $hash = (Get-FileHash servo-win.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '49d4b2c2d3576f93fad70812ee9e42820f5b84da9103f2a633838109a2fcde53') {
            Write-Error "servo v0.7.0 zip hash mismatch: $hash"
            exit 1
          }
          Expand-Archive servo-win.zip -DestinationPath servo-win
          foreach ($dll in 'libEGL.dll', 'libGLESv2.dll') {
            $src = Get-ChildItem -Recurse servo-win -Filter $dll | Select-Object -First 1
            if (-not $src) { Write-Error "$dll not found in servo v0.7.0 zip"; exit 1 }
            Copy-Item $src.FullName dist/
          }
          Get-ChildItem dist -Filter *.dll | Select-Object Name, Length

      - name: Download preserved native output for recovery
        if: inputs.raw_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: argon-raw-native-x64
          path: raw-native
          run-id: ${{ inputs.raw_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay exact native output on compatible runtime distribution
        if: inputs.raw_run_id != ''
        shell: pwsh
        run: |
          if (-not (Test-Path raw-native/argon.exe)) { throw 'Missing preserved native executable' }
          Copy-Item raw-native/* dist/ -Force
          Get-Content raw-native/source-commit.txt
          Get-FileHash dist/argon.exe -Algorithm SHA256 | Format-List

      - name: Create distribution zip
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath argon-windows-x64.zip -Force

      # Verification gate: the nightly is only (re)published if the packaged
      # zip launches headless from a clean directory and renders a page.
      - name: Smoke test packaged zip (headless render, clean dir)
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP 'argon-clean'
          if (Test-Path $clean) { Remove-Item -Recurse -Force $clean }
          New-Item -ItemType Directory -Force $clean | Out-Null
          Expand-Archive -Path argon-windows-x64.zip -DestinationPath $clean
          Set-Location $clean
          & (Join-Path $clean 'argon.exe') --headless --exit --output smoke.png "data:text/html,<html><head><title>Argon smoke</title></head><body style='background:%23112'><h1 style='color:%23eee;font-family:sans-serif'>Argon smoke test</h1><h2 id='js' style='color:%234a5;font-family:sans-serif'>JS pending</h2><script>document.getElementById('js').textContent='Argon JS OK';document.title='Argon JS OK'</script></body></html>" *> smoke-output.txt
          $code = $LASTEXITCODE
          Get-Content smoke-output.txt
          Copy-Item smoke-output.txt (Join-Path $env:GITHUB_WORKSPACE 'smoke-output.txt')
          if ($code -ne 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY "## Smoke test failed (exit $code)"
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            Add-Content $env:GITHUB_STEP_SUMMARY (Get-Content smoke-output.txt -Raw)
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            Write-Error "packaged headless launch failed with exit $code"; exit $code
          }
          if (Test-Path smoke.png) { Copy-Item smoke.png (Join-Path $env:GITHUB_WORKSPACE 'smoke.png'); Write-Host "smoke ok" } else { throw "No smoke screenshot produced" }

      - name: Embed smoke screenshot in log (base64) for retrieval
        if: success()
        shell: pwsh
        run: |
          if (Test-Path smoke.png) {
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes('smoke.png'))
            Write-Host "ARGON_SMOKE_PNG_BASE64_BEGIN"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) {
              Write-Host $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))
            }
            Write-Host "ARGON_SMOKE_PNG_BASE64_END"
          }

      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: argon-smoke-screenshot
          path: smoke.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argon-package-smoke-diagnostics
          path: |
            smoke-output.txt
            installed-smoke-output.txt
          if-no-files-found: warn
          retention-days: 14

      # Installer: built only after the smoke gate passed, from the verified
      # dist/ tree. NSIS ships with the windows-2022 runner image.
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $nsi = Join-Path $env:RUNNER_TEMP 'argon-installer.nsi'
          @'
          !include "MUI2.nsh"
          Name "Argon"
          OutFile "__OUTFILE__"
          Unicode true
          # Per-user install: no elevation, no admin prompt.
          InstallDir "$LOCALAPPDATA\Programs\Argon"
          InstallDirRegKey HKCU "Software\Argon" "InstallDir"
          RequestExecutionLevel user
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          Section "Argon browser" SecMain
            SetOutPath "$INSTDIR"
            File /r "__DISTDIR__\*.*"
            WriteUninstaller "$INSTDIR\uninstall.exe"
            CreateDirectory "$SMPROGRAMS\Argon"
            CreateShortcut "$SMPROGRAMS\Argon\Argon.lnk" "$INSTDIR\argon.exe"
            CreateShortcut "$DESKTOP\Argon.lnk" "$INSTDIR\argon.exe"
            WriteRegStr HKCU "Software\Argon" "InstallDir" "$INSTDIR"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Argon" "DisplayName" "Argon"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Argon" "DisplayIcon" "$INSTDIR\argon.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Argon" "UninstallString" "$INSTDIR\uninstall.exe"
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Argon" "NoModify" 1
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Argon" "NoRepair" 1
          SectionEnd
          Section "Uninstall"
            RMDir /r "$INSTDIR"
            Delete "$SMPROGRAMS\Argon\Argon.lnk"
            RMDir "$SMPROGRAMS\Argon"
            Delete "$DESKTOP\Argon.lnk"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Argon"
            DeleteRegKey HKCU "Software\Argon"
          SectionEnd
          '@ | Out-File -Encoding ascii $nsi
          # makensis resolves File/OutFile paths relative to the NSI script's
          # directory, so inject absolute paths for both.
          $distAbs = (Resolve-Path dist).Path
          $outAbs = Join-Path $env:GITHUB_WORKSPACE 'argon-setup-x64.exe'
          (Get-Content $nsi -Raw).Replace('__DISTDIR__', $distAbs).Replace('__OUTFILE__', $outAbs) | Set-Content $nsi -Encoding ascii
          makensis /V2 $nsi
          Get-Item argon-setup-x64.exe | Select-Object Name, Length

      # Installer verification: package smoke alone does not prove the
      # installer. Silent-install, launch the INSTALLED exe headless from its
      # installed folder (proves resources/DLLs travel with the install),
      # check the uninstall entry, then silent-uninstall and confirm removal.
      - name: Verify installer (silent install, launch, uninstall)
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Argon'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          Start-Process -FilePath .\argon-setup-x64.exe -ArgumentList '/S' -Wait
          if (-not (Test-Path (Join-Path $installDir 'argon.exe'))) { Write-Error "silent install did not place argon.exe"; exit 1 }
          foreach ($f in 'resources', 'argon.exe') {
            if (-not (Test-Path (Join-Path $installDir $f))) { Write-Error "installed tree missing $f"; exit 1 }
          }
          Set-Location $installDir
          & .\argon.exe --headless --exit --output installed-smoke.png "data:text/html,<html><body style='background:%23112'><h1 style='color:%23eee;font-family:sans-serif'>Argon installed smoke</h1></body></html>" *> installed-smoke-output.txt
          $code = $LASTEXITCODE
          Get-Content installed-smoke-output.txt
          Copy-Item installed-smoke-output.txt (Join-Path $env:GITHUB_WORKSPACE 'installed-smoke-output.txt')
          if ($code -ne 0) { Write-Error "installed exe headless launch failed with exit $code"; exit $code }
          if (-not (Test-Path installed-smoke.png)) { throw "Installed exe produced no screenshot" }
          $uninst = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Argon' -ErrorAction SilentlyContinue
          if (-not $uninst -or -not $uninst.UninstallString) { Write-Error "uninstall registry entry missing"; exit 1 }
          Set-Location $env:GITHUB_WORKSPACE
          # NSIS silent uninstall detaches (copies itself to %TEMP% and
          # returns), so poll for removal instead of a fixed sleep.
          Start-Process -FilePath (Join-Path $installDir 'uninstall.exe') -ArgumentList '/S'
          $gone = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if (-not (Test-Path (Join-Path $installDir 'argon.exe'))) { $gone = $true; break }
          }
          if (-not $gone) { Write-Error "silent uninstall left argon.exe behind after 60s"; exit 1 }
          Write-Host "installer verified: silent install, installed launch, uninstall entry, silent uninstall all OK"

      - name: Preserve exact candidate assets for later verified promotion
        uses: actions/upload-artifact@v4
        with:
          name: argon-candidate-assets
          path: |
            argon-windows-x64.zip
            argon-setup-x64.exe
          if-no-files-found: error
          retention-days: 14
