name: ui-capture

# Dispatch-only: launches a packaged Argon build HEADED on the runner's
# interactive session and captures ONLY the Argon window (never the full
# desktop, logs or anything else on screen). Produces the first real image of
# the Zen-style chrome for verification. No recompilation - captures the exact
# published nightly distribution zip that users download (ANGLE DLLs included).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag whose argon-windows-x64.zip to capture (nightly or nightly-candidate)'
        required: true
        default: 'nightly'

jobs:
  capture:
    name: Launch headed and capture Argon window
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      # Needed for windows/tests/media (the local mp4 playback assertion page).
      - uses: actions/checkout@v4

      - name: Download published nightly distribution zip
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/vio137/argon-windows/releases/download/${{ inputs.release_tag }}/argon-windows-x64.zip" -OutFile argon-nightly.zip
          Expand-Archive argon-nightly.zip -DestinationPath dist

      - name: Launch Argon headed and capture its window only
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public class Win32 {
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect);
            [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int count);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr hWnd, int X, int Y, int nWidth, int nHeight, bool bRepaint);
            [DllImport("user32.dll")] public static extern int GetSystemMetrics(int nIndex);
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr hwnd, int dwAttribute, out RECT pvAttribute, int cbAttribute);
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
          }
          '@
          $exe = Get-ChildItem -Path dist -Recurse -Filter argon.exe | Select-Object -First 1
          if (-not $exe) { Write-Error 'argon.exe not found inside the nightly zip'; exit 1 }
          Write-Host "launching $($exe.FullName)"
          Set-Location $exe.DirectoryName
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          # Wait up to 60s for a main window with a non-empty title.
          $hwnd = [IntPtr]::Zero
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            $proc.Refresh()
            if ($proc.HasExited) { Write-Error "argon.exe exited with code $($proc.ExitCode) before showing a window"; exit 1 }
            if ($proc.MainWindowHandle -ne [IntPtr]::Zero -and $proc.MainWindowTitle.Length -gt 0) { $hwnd = $proc.MainWindowHandle; break }
          }
          if ($hwnd -eq [IntPtr]::Zero) { Write-Error "no Argon main window appeared within 60s (session may not support headed windows)"; exit 1 }
          Write-Host "Argon window found: '$($proc.MainWindowTitle)' ($hwnd)"
          if ($proc.MainWindowTitle -notlike '*Argon*') { Write-Error "window title '$($proc.MainWindowTitle)' carries no Argon branding"; exit 1 }
          # Fit the window fully inside the actual display so the capture has no
          # off-screen black regions and no neighbours bleed into the frame.
          $sw = [Win32]::GetSystemMetrics(0); $sh = [Win32]::GetSystemMetrics(1)
          $wa = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
          Write-Host "screen: ${sw}x${sh} working area: $($wa.X),$($wa.Y) $($wa.Width)x$($wa.Height)"
          # Stay inside the taskbar-excluding working area so the taskbar can
          # never overlap the window in the capture.
          $tw = [Math]::Min(1280, $wa.Width - 20); $th = [Math]::Min(800, $wa.Height - 20)
          if (-not [Win32]::MoveWindow($hwnd, $wa.X + 10, $wa.Y + 10, $tw, $th, $true)) { Write-Error "MoveWindow failed"; exit 1 }
          Start-Sleep -Seconds 3
          [Win32]::SetForegroundWindow($hwnd) | Out-Null
          Start-Sleep -Seconds 20   # let chrome + page finish rendering
          # Visible frame bounds (excludes the invisible DWM resize borders that
          # GetWindowRect includes and that leaked the console/taskbar before).
          $rect = New-Object Win32+RECT
          $DWMWA_EXTENDED_FRAME_BOUNDS = 9
          $hr = [Win32]::DwmGetWindowAttribute($hwnd, $DWMWA_EXTENDED_FRAME_BOUNDS, [ref]$rect, [Runtime.InteropServices.Marshal]::SizeOf([type][Win32+RECT]))
          if ($hr -ne 0) { Write-Error "DwmGetWindowAttribute failed ($hr)"; exit 1 }
          # Clip to the screen just in case.
          $left = [Math]::Max(0, $rect.Left); $top = [Math]::Max(0, $rect.Top)
          $right = [Math]::Min($sw, $rect.Right); $bottom = [Math]::Min($sh, $rect.Bottom)
          $w = $right - $left; $h = $bottom - $top
          Write-Host "Visible frame: $left,$top ${w}x${h}"
          if ($w -lt 100 -or $h -lt 100) { Write-Error "window too small to be real ($w x $h)"; exit 1 }
          $bmp = New-Object System.Drawing.Bitmap $w, $h
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($left, $top, 0, 0, $bmp.Size)
          $out = Join-Path $env:GITHUB_WORKSPACE 'argon-ui.png'
          $bmp.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "captured $out ($w x $h)"

      - name: Verify capture is not blank
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = [System.Drawing.Bitmap]::FromFile('argon-ui.png')
          # Sample a grid of pixels; a uniform image means the capture failed.
          $colors = @{}
          for ($x = 0; $x -lt $bmp.Width; $x += 37) {
            for ($y = 0; $y -lt $bmp.Height; $y += 37) {
              $c = $bmp.GetPixel($x, $y)
              $key = "$($c.R),$($c.G),$($c.B)"
              $colors[$key] = ($colors[$key] ?? 0) + 1
            }
          }
          $bmp.Dispose()
          Write-Host "distinct sampled colors: $($colors.Count)"
          if ($colors.Count -lt 4) { Write-Error "capture looks blank/uniform - not a real UI image"; exit 1 }

          # Dark-chrome check: the left sidebar surface must be Zen-dark, not light.
          $bmp2 = [System.Drawing.Bitmap]::FromFile('argon-ui.png')
          $px = $bmp2.GetPixel(8, [int]($bmp2.Height / 2))
          $bmp2.Dispose()
          Write-Host "sidebar pixel: $($px.R),$($px.G),$($px.B)"
          if ($px.R -gt 80 -or $px.G -gt 80 -or $px.B -gt 80) { Write-Error "sidebar is light ($($px.R),$($px.G),$($px.B)) - Zen dark chrome not applied"; exit 1 }

      # Media gate: plays a real local h264 mp4 HEADED and asserts playback
      # actually progresses - the page samples video.currentTime twice and only
      # sets 'Argon VIDEO OK' when playback time advances, then two window
      # captures 4s apart must differ (decoded frames really advance). A bare
      # 'playing' event alone would not prove either. Skipped (not failed) for
      # pre-media packages (no gstlibav.dll). Audio is NOT asserted here: the
      # sample has no audio track and the runner has no audio device.
      - name: Media playback assertion (local mp4, headed)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public class Win32M {
            [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int count);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern int GetSystemMetrics(int nIndex);
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr hwnd, int dwAttribute, out RECT pvAttribute, int cbAttribute);
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
          }
          '@
          $exe = Get-ChildItem -Path dist -Recurse -Filter argon.exe | Select-Object -First 1
          if (-not (Test-Path (Join-Path $exe.DirectoryName 'gstlibav.dll'))) {
            Write-Host 'NOTICE: package has no GStreamer (pre-media build) - skipping media assertion'
            exit 0
          }
          $mediaDir = Join-Path $env:GITHUB_WORKSPACE 'windows\tests\media'
          # Stronger page than the repo's media-test.html (which only listens for
          # 'playing'): requires currentTime to advance by >0.4s across 1.5s.
          @'
          <!DOCTYPE html><html><head><meta charset="utf-8"><title>Argon media test pending</title>
          <style>body{margin:0;background:#181a1f;color:#e8eaed;font-family:sans-serif}#status{padding:12px 16px;font-size:20px}video{width:640px;margin:0 16px;background:#000}</style>
          </head><body><div id="status">media test running...</div>
          <video id="v" autoplay muted loop src="sample.mp4"></video>
          <script>
            var v = document.getElementById('v'), s = document.getElementById('status');
            var t0 = null;
            function bad(kind) { s.textContent = 'VIDEO FAILED: ' + kind; document.title = 'Argon VIDEO ERR ' + kind; }
            v.addEventListener('playing', function () {
              if (t0 === null) { t0 = v.currentTime; setTimeout(function () {
                if (v.currentTime > t0 + 0.4) { s.textContent = 'VIDEO PLAYING'; document.title = 'Argon VIDEO OK'; }
                else { bad('stalled currentTime ' + t0 + ' -> ' + v.currentTime); }
              }, 1500); }
            });
            v.addEventListener('error', function () { bad(v.error ? ('code' + v.error.code) : 'unknown'); });
            setTimeout(function () {
              if (document.title.indexOf('Argon VIDEO OK') !== 0 && document.title.indexOf('Argon VIDEO ERR') !== 0) {
                bad('timeout readyState' + v.readyState);
              }
            }, 25000);
          </scr`ipt>
          </body></html>
          '@ -replace '`','' | Set-Content -Encoding utf8 (Join-Path $mediaDir 'ci-media-test.html')
          $url = 'file:///' + ($mediaDir -replace '\\','/') + '/ci-media-test.html'
          Write-Host "launching $($exe.FullName) $url"
          Set-Location $exe.DirectoryName
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList $url -PassThru
          $verdict = ''
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            $proc.Refresh()
            if ($proc.HasExited) { Write-Error "argon.exe exited ($($proc.ExitCode)) during media test"; exit 1 }
            $t = $proc.MainWindowTitle
            if ($t -like 'Argon VIDEO OK*') { $verdict = 'OK'; break }
            if ($t -like 'Argon VIDEO ERR*') { $verdict = $t; break }
          }
          Write-Host "media window title: '$($proc.MainWindowTitle)'"
          if ($verdict -ne 'OK') {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            if ($verdict) { Write-Error "video playback failed: $verdict" } else { Write-Error 'video playback verdict timed out (90s) with no OK/ERR title' }
            exit 1
          }
          function Capture-ArgonWindow($hwnd, $outPath) {
            [Win32M]::SetForegroundWindow($hwnd) | Out-Null
            Start-Sleep -Seconds 1
            $rect = New-Object Win32M+RECT
            [Win32M]::DwmGetWindowAttribute($hwnd, 9, [ref]$rect, [Runtime.InteropServices.Marshal]::SizeOf([type][Win32M+RECT])) | Out-Null
            $sw = [Win32M]::GetSystemMetrics(0); $sh = [Win32M]::GetSystemMetrics(1)
            $left = [Math]::Max(0, $rect.Left); $top = [Math]::Max(0, $rect.Top)
            $right = [Math]::Min($sw, $rect.Right); $bottom = [Math]::Min($sh, $rect.Bottom)
            $w = $right - $left; $h = $bottom - $top
            if ($w -lt 100 -or $h -lt 100) { Write-Error "media window too small ($w x $h)"; exit 1 }
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($left, $top, 0, 0, $bmp.Size)
            $bmp.Save($outPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $pngA = Join-Path $env:GITHUB_WORKSPACE 'argon-media-a.png'
          $pngB = Join-Path $env:GITHUB_WORKSPACE 'argon-media-b.png'
          Capture-ArgonWindow $proc.MainWindowHandle $pngA
          Start-Sleep -Seconds 4
          Capture-ArgonWindow $proc.MainWindowHandle $pngB
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          # Frames must differ: the sample's test pattern moves continuously.
          $a = [System.Drawing.Bitmap]::FromFile($pngA)
          $b = [System.Drawing.Bitmap]::FromFile($pngB)
          if ($a.Width -ne $b.Width -or $a.Height -ne $b.Height) { Write-Error 'media captures differ in size'; exit 1 }
          $diff = 0
          for ($x = 0; $x -lt $a.Width; $x += 11) { for ($y = 0; $y -lt $a.Height; $y += 11) {
            $pa = $a.GetPixel($x, $y); $pb = $b.GetPixel($x, $y)
            if ([Math]::Abs($pa.R - $pb.R) -gt 24 -or [Math]::Abs($pa.G - $pb.G) -gt 24 -or [Math]::Abs($pa.B - $pb.B) -gt 24) { $diff++ }
          } }
          $a.Dispose(); $b.Dispose()
          Write-Host "differing sampled pixels between frames 4s apart: $diff"
          if ($diff -lt 20) { Write-Error 'video frames did not advance (captures identical) - decoded playback not proven'; exit 1 }
          Copy-Item $pngA (Join-Path $env:GITHUB_WORKSPACE 'argon-media.png') -Force
          Write-Host 'media gate PASSED: currentTime advanced and rendered frames differ'

      - name: Embed media capture in log (base64)
        if: ${{ always() && hashFiles('argon-media.png') != '' }}
        shell: pwsh
        run: |
          foreach ($f in 'argon-media-a.png', 'argon-media-b.png') {
            if (-not (Test-Path $f)) { continue }
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f))
            Write-Host "ARGON_MEDIA_PNG_BASE64_BEGIN $f"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) {
              Write-Host $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))
            }
            Write-Host "ARGON_MEDIA_PNG_BASE64_END $f"
          }

      # Evidence capture only, never a gate: YouTube uses MSE, which Servo has
      # not implemented (https://github.com/servo/servo/issues/44403). Records
      # the actual watch-page behavior of the current build so reports to the
      # user describe observed reality, not assumptions.
      - name: YouTube watch-page behavior capture (non-fatal)
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public class Win32Y {
            [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int count);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern int GetSystemMetrics(int nIndex);
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr hwnd, int dwAttribute, out RECT pvAttribute, int cbAttribute);
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
          }
          '@
          $exe = Get-ChildItem -Path dist -Recurse -Filter argon.exe | Select-Object -First 1
          Set-Location $exe.DirectoryName
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList 'https://www.youtube.com/watch?v=aqz-KE-bpKQ' -PassThru
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            $proc.Refresh()
            if ($proc.HasExited) { Write-Host "argon exited ($($proc.ExitCode)) before YouTube capture"; exit 1 }
            if ($proc.MainWindowHandle -ne [IntPtr]::Zero -and $proc.MainWindowTitle.Length -gt 0) { break }
          }
          Start-Sleep -Seconds 45   # let page + player attempt to initialize
          $proc.Refresh()
          Write-Host "youtube window title: '$($proc.MainWindowTitle)'"
          [Win32Y]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 1
          $rect = New-Object Win32Y+RECT
          [Win32Y]::DwmGetWindowAttribute($proc.MainWindowHandle, 9, [ref]$rect, [Runtime.InteropServices.Marshal]::SizeOf([type][Win32Y+RECT])) | Out-Null
          $sw = [Win32Y]::GetSystemMetrics(0); $sh = [Win32Y]::GetSystemMetrics(1)
          $left = [Math]::Max(0, $rect.Left); $top = [Math]::Max(0, $rect.Top)
          $right = [Math]::Min($sw, $rect.Right); $bottom = [Math]::Min($sh, $rect.Bottom)
          $w = $right - $left; $h = $bottom - $top
          if ($w -lt 100 -or $h -lt 100) { Write-Host "window too small ($w x $h)"; exit 1 }
          $bmp = New-Object System.Drawing.Bitmap $w, $h
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($left, $top, 0, 0, $bmp.Size)
          $bmp.Save((Join-Path $env:GITHUB_WORKSPACE 'argon-youtube.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE 'argon-youtube.png')))
          Write-Host "ARGON_YT_PNG_BASE64_BEGIN"
          for ($i = 0; $i -lt $b64.Length; $i += 4000) {
            Write-Host $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))
          }
          Write-Host "ARGON_YT_PNG_BASE64_END"

      - name: Embed capture in log (base64) for retrieval
        shell: pwsh
        run: |
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes('argon-ui.png'))
          Write-Host "ARGON_UI_PNG_BASE64_BEGIN"
          for ($i = 0; $i -lt $b64.Length; $i += 4000) {
            Write-Host $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))
          }
          Write-Host "ARGON_UI_PNG_BASE64_END"

      - name: Upload capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: argon-ui-capture
          path: |
            argon-ui.png
            argon-media.png
            argon-media-a.png
            argon-media-b.png
            argon-youtube.png
          if-no-files-found: warn
          retention-days: 14
