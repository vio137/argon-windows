name: windows-build

# Builds the Argon Windows desktop browser (windows/ crate, Servo engine).
# Deliberately separate from the archived Android CI; do not merge them.

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

# A newer push supersedes older in-progress builds of the same branch.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build argon.exe (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The Servo git dependency contains deeply nested WPT/test262 paths that
      # exceed the classic Windows MAX_PATH; cargo's libgit2 checkout needs both
      # the OS opt-in and git's core.longpaths.
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          git config --global core.longpaths true

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
      - run: echo CCACHE=ccache >> $GITHUB_ENV

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm
      - name: Set LIBCLANG_PATH
        run: |
          $llvm_bin = Join-Path $env:LLVM_PATH "bin"
          echo "LIBCLANG_PATH=$llvm_bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          cache-all-crates: "true"

      - name: Build argon (release)
        working-directory: windows
        run: cargo build --profile release

      # Runtime verification gate: launch the freshly built engine headless,
      # render a page, and save a screenshot. A crash or nonzero exit fails
      # the build, so the nightly release is only published for binaries that
      # actually start and render.
      - name: Smoke test argon.exe (headless render)
        working-directory: windows
        shell: pwsh
        run: |
          $exe = "target/release/argon.exe"
          if (-not (Test-Path $exe)) { Write-Error "argon.exe missing"; exit 1 }
          & $exe --headless --exit --output smoke.png "data:text/html,<html><body style='background:%23112'><h1 style='color:%23eee;font-family:sans-serif'>Argon smoke test</h1></body></html>"
          if ($LASTEXITCODE -ne 0) { Write-Error "headless launch failed with exit $LASTEXITCODE"; exit $LASTEXITCODE }
          if (Test-Path smoke.png) { Write-Host "smoke.png written: $((Get-Item smoke.png).Length) bytes" } else { Write-Warning "no screenshot produced" }

      - name: List packaged runtime files
        working-directory: windows
        shell: pwsh
        run: Get-ChildItem target/release -File | Where-Object { $_.Extension -in '.exe','.dll' } | Select-Object Name,Length | Format-Table -AutoSize

      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: argon-smoke-screenshot
          path: windows/smoke.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload argon.exe
        uses: actions/upload-artifact@v4
        with:
          name: argon-windows-x64
          path: |
            windows/target/release/argon.exe
            windows/target/release/*.dll
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish nightly pre-release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download argon.exe artifact
        uses: actions/download-artifact@v4
        with:
          name: argon-windows-x64
          path: dist

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath argon-windows-x64.zip -Force

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Argon nightly (Windows x64)
          prerelease: true
          files: argon-windows-x64.zip
