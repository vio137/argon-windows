name: windows-build

# Builds the Argon Windows desktop browser (windows/ crate, Servo engine).
# Deliberately separate from the archived Android CI; do not merge them.

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build argon.exe (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
      - run: echo CCACHE=ccache >> $GITHUB_ENV

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm
      - name: Set LIBCLANG_PATH
        run: |
          $llvm_bin = Join-Path $env:LLVM_PATH "bin"
          echo "LIBCLANG_PATH=$llvm_bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          cache-all-crates: "true"

      - name: Build argon (release)
        working-directory: windows
        run: cargo build --profile release

      - name: Upload argon.exe
        uses: actions/upload-artifact@v4
        with:
          name: argon-windows-x64
          path: |
            windows/target/release/argon.exe
            windows/target/release/*.dll
          if-no-files-found: error
          retention-days: 14
