name: windows-build

# Builds the Argon Windows desktop browser (windows/ crate, Servo engine).
# Deliberately separate from the archived Android CI; do not merge them.

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

# A newer push supersedes older in-progress builds of the same branch.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build argon.exe (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The Servo git dependency contains deeply nested WPT/test262 paths that
      # exceed the classic Windows MAX_PATH; cargo's libgit2 checkout needs both
      # the OS opt-in and git's core.longpaths.
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          git config --global core.longpaths true

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
      - run: echo CCACHE=ccache >> $GITHUB_ENV

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm
      - name: Set LIBCLANG_PATH
        run: |
          $llvm_bin = Join-Path $env:LLVM_PATH "bin"
          echo "LIBCLANG_PATH=$llvm_bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          cache-all-crates: "true"

      # GStreamer: servo's media-gstreamer feature (enabled in windows/Cargo.toml)
      # needs the official MSVC runtime + devel packages - the same ones
      # `mach bootstrap-gstreamer` installs (servo python/servo/platform/windows.py),
      # pinned to 1.22.8 with sha256. The MSVC installer's bin dir ships
      # pkg-config, so putting it on PATH is how gstreamer-sys finds the libs
      # (the same mechanism `mach build` uses via build_env()).
      - name: Install GStreamer 1.22.8 (MSVC, sha256-pinned)
        shell: pwsh
        run: |
          $deps = @(
            @{ Url = 'https://github.com/servo/servo-build-deps/releases/download/msvc-deps/gstreamer-1.0-msvc-x86_64-1.22.8.msi'; Sha256 = '37f9973fe5c720ce1f1602e7e599336384b9ff3e4878817987dd6b77265f17bb' },
            @{ Url = 'https://github.com/servo/servo-build-deps/releases/download/msvc-deps/gstreamer-1.0-devel-msvc-x86_64-1.22.8.msi'; Sha256 = '2d0cf6e89cf88d94e670cd81087c002408161d1c8843c00d3f27d33ce254c523' }
          )
          foreach ($d in $deps) {
            $msi = Join-Path $env:RUNNER_TEMP (Split-Path $d.Url -Leaf)
            Invoke-WebRequest -Uri $d.Url -OutFile $msi
            $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $d.Sha256) { Write-Error "sha256 mismatch for $($d.Url): got $hash"; exit 1 }
            $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Write-Error "msiexec failed for $msi (exit $($p.ExitCode))"; exit 1 }
          }
          $bin = 'C:\gstreamer\1.0\msvc_x86_64\bin'
          if (-not (Test-Path (Join-Path $bin 'gstreamer-1.0-0.dll'))) { Write-Error "GStreamer runtime not found at $bin after install"; exit 1 }
          Add-Content $env:GITHUB_PATH $bin
          Write-Host "GStreamer 1.22.8 installed, $bin on PATH"

      - name: Build argon (release)
        working-directory: windows
        run: cargo build --profile release

      - name: List packaged runtime files
        working-directory: windows
        shell: pwsh
        run: Get-ChildItem target/release -File | Where-Object { $_.Extension -in '.exe','.dll' } | Select-Object Name,Length | Format-Table -AutoSize

      # Distribution layout: exe + DLLs + Servo's engine resources (internal
      # pages, resource protocol handlers) taken from the cargo git checkout.
      - name: Package for distribution
        working-directory: windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/package | Out-Null
          Copy-Item target/release/argon.exe target/package/
          Get-ChildItem target/release/*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination target/package/
          # ANGLE DLLs: mozangle builds libEGL/libGLESv2 deep in the cargo build
          # tree and plain cargo never copies them next to the exe (servo's mach
          # copy_windows_dlls_to_build_directory step does). Without these the
          # packaged browser panics at launch: "egl function was not loaded".
          # Hard-fail here so the main pipeline can never produce a deficient zip.
          foreach ($dll in 'libEGL.dll', 'libGLESv2.dll') {
            $found = Get-ChildItem target -Recurse -Filter $dll -File | Select-Object -First 1
            if (-not $found) { Write-Error "$dll not found in the cargo build tree"; exit 1 }
            Copy-Item $found.FullName target/package/
            Write-Host "packaged $($found.FullName)"
          }
          # GStreamer runtime + plugins must sit NEXT TO argon.exe: servo passes
          # the exe directory as the plugin path (servo components/servo/servo.rs,
          # GStreamerBackend::init_with_plugins). Lists mirror servo v0.7.0
          # python/servo/gstreamer.py (windows_dlls) and
          # components/servo/gstreamer_plugin_lists/{common,windows}.rs.in,
          # version-locked to the pinned GStreamer 1.22.8 MSVC install above.
          # Hard-fail on any missing file so a media-less zip can never publish.
          $gstRoot = 'C:\gstreamer\1.0\msvc_x86_64'
          $gstDlls = @(
            'avcodec-59.dll','avfilter-8.dll','avformat-59.dll','avutil-57.dll',
            'bz2.dll','ffi-7.dll','gio-2.0-0.dll','glib-2.0-0.dll','gmodule-2.0-0.dll',
            'gobject-2.0-0.dll','graphene-1.0-0.dll','intl-8.dll','libcrypto-1_1-x64.dll',
            'libjpeg-8.dll','libogg-0.dll','libpng16-16.dll','libssl-1_1-x64.dll',
            'libvorbis-0.dll','libvorbisenc-2.dll','libwinpthread-1.dll','nice-10.dll',
            'opus-0.dll','orc-0.4-0.dll','pcre2-8-0.dll','swresample-4.dll','theora-0.dll',
            'theoradec-1.dll','theoraenc-1.dll','z-1.dll',
            'gstbase-1.0-0.dll','gstcontroller-1.0-0.dll','gstnet-1.0-0.dll','gstreamer-1.0-0.dll',
            'gstapp-1.0-0.dll','gstaudio-1.0-0.dll','gstfft-1.0-0.dll','gstgl-1.0-0.dll',
            'gstpbutils-1.0-0.dll','gstplay-1.0-0.dll','gstriff-1.0-0.dll','gstrtp-1.0-0.dll',
            'gstrtsp-1.0-0.dll','gstsctp-1.0-0.dll','gstsdp-1.0-0.dll','gsttag-1.0-0.dll',
            'gstvideo-1.0-0.dll','gstcodecparsers-1.0-0.dll','gstplayer-1.0-0.dll',
            'gstwebrtc-1.0-0.dll','gstwebrtcnice-1.0-0.dll'
          )
          $gstPlugins = @(
            'gstcoreelements','gstnice','gstapp','gstaudioconvert','gstaudioresample',
            'gstgio','gstogg','gstopengl','gstopus','gstplayback','gsttheora',
            'gsttypefindfunctions','gstvideoconvertscale','gstvolume','gstvorbis',
            'gstaudiofx','gstaudioparsers','gstautodetect','gstdeinterleave','gstid3demux',
            'gstinterleave','gstisomp4','gstmatroska','gstrtp','gstrtpmanager',
            'gstvideofilter','gstvpx','gstwavparse','gstaudiobuffersplit','gstdtls',
            'gstid3tag','gstproxy','gstvideoparsersbad','gstwebrtc','gstlibav','gstwasapi'
          )
          foreach ($dll in $gstDlls) {
            $src = Join-Path $gstRoot "bin\$dll"
            if (-not (Test-Path $src)) { Write-Error "GStreamer DLL missing: $src"; exit 1 }
            Copy-Item $src target/package/ -Force
          }
          foreach ($plugin in $gstPlugins) {
            $src = Join-Path $gstRoot "lib\gstreamer-1.0\$plugin.dll"
            if (-not (Test-Path $src)) { Write-Error "GStreamer plugin missing: $src"; exit 1 }
            Copy-Item $src target/package/ -Force
          }
          Write-Host "packaged $($gstDlls.Count) GStreamer DLLs and $($gstPlugins.Count) plugins"
          $checkout = Get-ChildItem "$env:USERPROFILE\.cargo\git\checkouts" -Directory -Filter 'servo-*' | ForEach-Object { Get-ChildItem $_.FullName -Directory } | Where-Object { Test-Path (Join-Path $_.FullName 'resources') } | Select-Object -First 1
          if (-not $checkout) { Write-Error 'Servo resources checkout not found'; exit 1 }
          Copy-Item -Recurse (Join-Path $checkout.FullName 'resources') (Join-Path 'target/package' 'resources')
          Compress-Archive -Path target/package/* -DestinationPath argon-windows-x64.zip -Force

      # Upload the distribution zip BEFORE the smoke gate: if the gate fails,
      # the compiled package survives for the dispatch-only package-release
      # workflow to iterate on without a full recompile.
      - name: Upload distribution zip
        uses: actions/upload-artifact@v4
        with:
          name: argon-windows-x64
          path: windows/argon-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      # Runtime verification gate: extract the distribution zip into a clean
      # directory outside the repo and launch the packaged engine headless,
      # rendering a page to a screenshot. A crash or nonzero exit fails the
      # build, so the nightly only publishes for a package that actually
      # starts and renders with only the files inside the zip. All output is
      # preserved: echoed to the log, copied back as an artifact, and written
      # to the step summary on failure.
      - name: Smoke test packaged zip (headless render, clean dir)
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP 'argon-clean'
          if (Test-Path $clean) { Remove-Item -Recurse -Force $clean }
          New-Item -ItemType Directory -Force $clean | Out-Null
          Expand-Archive -Path windows/argon-windows-x64.zip -DestinationPath $clean
          $log = Join-Path $clean 'smoke-output.txt'
          Set-Location $clean
          & (Join-Path $clean 'argon.exe') --headless --exit --output smoke.png "data:text/html,<html><head><title>Argon smoke</title></head><body style='background:%23112'><h1 style='color:%23eee;font-family:sans-serif'>Argon smoke test</h1><h2 id='js' style='color:%234a5;font-family:sans-serif'>JS pending</h2><script>document.getElementById('js').textContent='Argon JS OK';document.title='Argon JS OK'</script></body></html>" *> $log
          $code = $LASTEXITCODE
          Copy-Item $log (Join-Path $env:GITHUB_WORKSPACE 'windows/smoke-output.txt') -ErrorAction SilentlyContinue
          Get-Content $log
          if ($code -ne 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY "## Smoke test failed (exit $code)"
            Add-Content $env:GITHUB_STEP_SUMMARY '```text'
            Add-Content $env:GITHUB_STEP_SUMMARY (Get-Content $log -Raw)
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            Write-Error "packaged headless launch failed with exit $code"
            exit $code
          }
          if (Test-Path smoke.png) { Copy-Item smoke.png (Join-Path $env:GITHUB_WORKSPACE 'windows/smoke.png'); Write-Host "smoke.png written" } else { Write-Warning "no screenshot produced" }

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argon-smoke-diagnostics
          path: |
            windows/smoke.png
            windows/smoke-output.txt
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish nightly pre-release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download distribution zip
        uses: actions/download-artifact@v4
        with:
          name: argon-windows-x64
          path: dist

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Argon nightly (Windows x64)
          prerelease: true
          files: dist/argon-windows-x64.zip
